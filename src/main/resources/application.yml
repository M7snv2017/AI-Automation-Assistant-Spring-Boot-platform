spring:
  application:
    name: ai-automation-assistant
  profiles:
    active: local

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:aiautomationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

ollama:
  host: ${OLLAMA_HOST:http://localhost:11434}
  default-model: qwen2.5-coder:14b
