<!DOCTYPE html>
<html lang="en" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - AI Automation Assistant</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Style -->
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../css/style.css">
</head>

<body>

  <div id="app-wrapper">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay"></div>

    <!-- App Sidebar -->
    <aside th:replace="~{fragments/layout :: sidebar('calendar')}"></aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Navbar -->
      <header th:replace="~{fragments/layout :: navbar('Schedule & Calendar')}"></header>

      <!-- Page Content -->
      <div class="page-content">
        <div class="row g-4">
          <!-- Calendar Grid Column -->
          <div class="col-lg-8 col-xl-9">
            <div class="card-saas p-4">
              <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                  <select id="calendar-month-select"
                    class="form-select form-select-sm fw-bold border-primary-subtle fs-5 py-1 px-3"
                    style="width: 160px; cursor: pointer;"></select>
                  <select id="calendar-year-select"
                    class="form-select form-select-sm fw-bold border-primary-subtle fs-5 py-1 px-3"
                    style="width: 110px; cursor: pointer;"></select>
                </div>
                <div class="btn-group">
                  <button id="cal-prev-btn" class="btn btn-secondary-saas btn-sm" title="Previous Month"><i
                      class="bi bi-chevron-left"></i></button>
                  <button id="cal-today-btn" class="btn btn-secondary-saas btn-sm" title="Jump to Today">Today</button>
                  <button id="cal-next-btn" class="btn btn-secondary-saas btn-sm" title="Next Month"><i
                      class="bi bi-chevron-right"></i></button>
                </div>
              </div>
              <div class="d-flex align-items-center gap-3 mb-3 small flex-wrap px-1">
                <span class="d-flex align-items-center gap-1.5"> <span class="d-inline-block rounded-circle"
                    style="width: 10px; height: 10px; background-color: #3b82f6 !important;"> </span> General Automation
                  (Cat 1)</span>
                <span class="d-flex align-items-center gap-1.5"> <span class="d-inline-block rounded-circle"
                    style="width: 10px; height: 10px; background-color: #8b5cf6 !important;"> </span> Email Management
                  (Cat 2)</span>
                <span class="d-flex align-items-center gap-1.5"> <span class="d-inline-block rounded-circle"
                    style="width: 10px; height: 10px; background-color: #10b981 !important;"> </span> Schedule &
                  Reminders (Cat 3)</span>
                <span class="d-flex align-items-center gap-1.5"> <span class="d-inline-block rounded-circle"
                    style="width: 10px; height: 10px; background-color: #f97316 !important;"> </span> Database
                  Management
                  (Cat 4)</span>
                <span class="d-flex align-items-center gap-1.5"> <span class="d-inline-block rounded-circle"
                    style="width: 10px; height: 10px; background-color: #ef4444 !important;"> </span> Failed
                  Executions</span>
              </div>
              <div id="full-calendar-grid" class="calendar-grid calendar-full"></div>
            </div>
          </div>

          <!-- Selected Day Side Panel -->
          <div class="col-lg-4 col-xl-3">
            <div class="card-saas h-100">
              <div class="card-saas-header">
                <h6 class="fw-bold mb-0"><i class="bi bi-calendar-event me-2 text-primary"></i> Event Agenda</h6>
              </div>
              <div class="card-saas-body">
                <div id="selected-day-details">
                  <div class="empty-state py-4">
                    <div class="empty-state-icon" style="width: 56px; height: 56px; font-size: 1.5rem;">
                      <i class="bi bi-calendar-x"></i>
                    </div>
                    <h6 class="empty-state-title">No scheduled events</h6>
                    <p class="empty-state-text mb-0">Select any day on the calendar to view or schedule automations.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script th:src="@{/js/app.js}" src="../js/app.js"></script>
</body>

</html>
