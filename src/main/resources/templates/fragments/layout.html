<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

  <!-- Reusable Sidebar Fragment -->
  <aside th:fragment="sidebar(activePage)" class="app-sidebar">
    <div class="sidebar-header">
      <a th:href="@{/dashboard}" href="dashboard.html" class="sidebar-brand">
        <div class="sidebar-brand-icon">
          <i class="bi bi-robot"></i>
        </div>
        <span class="sidebar-brand-text">AI Assistant</span>
      </a>
    </div>
    <div class="sidebar-body">
      <ul class="sidebar-nav">
        <li class="sidebar-section-title">Overview</li>
        <li class="sidebar-nav-item">
          <a th:href="@{/dashboard}" th:class="${activePage == 'dashboard' ? 'sidebar-nav-link active' : 'sidebar-nav-link'}">
            <i class="bi bi-grid-1x2-fill"></i>
            <span class="nav-text">Dashboard</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a th:href="@{/chat}" th:class="${activePage == 'chat' ? 'sidebar-nav-link active' : 'sidebar-nav-link'}">
            <i class="bi bi-chat-left-text-fill"></i>
            <span class="nav-text">Chat</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a th:href="@{/tasks}" th:class="${activePage == 'tasks' ? 'sidebar-nav-link active' : 'sidebar-nav-link'}">
            <i class="bi bi-check2-square"></i>
            <span class="nav-text">Tasks</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a th:href="@{/calendar}" th:class="${activePage == 'calendar' ? 'sidebar-nav-link active' : 'sidebar-nav-link'}">
            <i class="bi bi-calendar3"></i>
            <span class="nav-text">Calendar</span>
          </a>
        </li>
        
        <li class="sidebar-section-title">Management</li>
        <li class="sidebar-nav-item">
          <a th:href="@{/history}" th:class="${activePage == 'history' ? 'sidebar-nav-link active' : 'sidebar-nav-link'}">
            <i class="bi bi-clock-history"></i>
            <span class="nav-text">History</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a th:href="@{/notifications}" th:class="${activePage == 'notifications' ? 'sidebar-nav-link active' : 'sidebar-nav-link'}">
            <i class="bi bi-bell-fill"></i>
            <span class="nav-text">Notifications</span>
            <span th:if="${unreadNotificationsCount != null && unreadNotificationsCount > 0}" 
                  class="badge bg-danger rounded-pill ms-auto" 
                  style="font-size: 0.7rem;" 
                  th:text="${unreadNotificationsCount}">3</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a th:href="@{/settings}" th:class="${activePage == 'settings' ? 'sidebar-nav-link active' : 'sidebar-nav-link'}">
            <i class="bi bi-gear-fill"></i>
            <span class="nav-text">Settings</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a th:href="@{/profile}" th:class="${activePage == 'profile' ? 'sidebar-nav-link active' : 'sidebar-nav-link'}">
            <i class="bi bi-person-circle"></i>
            <span class="nav-text">Profile</span>
          </a>
        </li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <a th:href="@{/logout}" href="index.html" class="sidebar-nav-link text-danger">
        <i class="bi bi-box-arrow-right"></i>
        <span class="nav-text">Logout</span>
      </a>
    </div>
  </aside>

  <!-- Reusable Navbar Fragment -->
  <header th:fragment="navbar(pageTitle)" class="app-navbar">
    <div class="navbar-left">
      <button class="btn-sidebar-toggle" title="Toggle Sidebar">
        <i class="bi bi-list"></i>
      </button>
      <h5 class="fw-bold mb-0 text-body d-none d-sm-block" th:text="${pageTitle}">Dashboard</h5>
    </div>
    <div class="navbar-right">
      <!-- Theme Toggle -->
      <button class="btn-icon theme-toggle" title="Toggle Light/Dark Mode">
        <i class="bi bi-moon-stars-fill"></i>
      </button>
      
      <!-- Notifications Quick Link -->
      <a th:href="@{/notifications}" href="notifications.html" class="btn-icon position-relative" title="Notifications">
        <i class="bi bi-bell"></i>
        <span th:if="${unreadNotificationsCount != null && unreadNotificationsCount > 0}" 
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
              style="font-size: 0.65rem;" 
              th:text="${unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount}">3</span>
      </a>
      
      <!-- User Profile Dropdown -->
      <div class="dropdown">
        <button class="btn p-0 border-0 d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 38px; height: 38px;" th:text="${user != null && user.fullName != null && !user.fullName.isEmpty() ? #strings.substring(user.fullName, 0, 1).toUpperCase() : 'U'}">
            JD
          </div>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
          <li class="px-3 py-2 border-bottom">
            <div class="fw-bold" th:text="${user != null ? user.fullName : 'User'}">John Doe</div>
            <div class="small text-muted" th:text="${user != null ? user.email : ''}">john.doe@example.com</div>
          </li>
          <li><a class="dropdown-menu-item dropdown-item py-2" th:href="@{/profile}" href="profile.html"><i class="bi bi-person me-2"></i> Profile</a></li>
          <li><a class="dropdown-menu-item dropdown-item py-2" th:href="@{/settings}" href="settings.html"><i class="bi bi-gear me-2"></i> Settings</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-menu-item dropdown-item py-2 text-danger" th:href="@{/logout}" href="index.html"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
        </ul>
      </div>
    </div>
  </header>

</body>
</html>
