<!DOCTYPE html>
<html lang="en" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Automation Assistant</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Style -->
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
      <a th:href="@{/}" href="index.html" class="d-inline-flex align-items-center gap-2 mb-3 text-body text-decoration-none">
        <div class="sidebar-brand-icon">
          <i class="bi bi-robot"></i>
        </div>
        <span class="fs-4 fw-bold">AI Automation</span>
      </a>
      <h4 class="fw-bold mb-1">Welcome back</h4>
      <p class="text-secondary small">Sign in to manage your AI assistant and automations</p>
    </div>

    <div class="card-saas p-4">
      <div th:if="${errorMessage}" class="alert alert-danger p-2 small mb-3" role="alert" th:text="${errorMessage}"></div>
      <div th:if="${successMessage}" class="alert alert-success p-2 small mb-3" role="alert" th:text="${successMessage}"></div>
      <div th:if="${param.registered}" class="alert alert-success p-2 small mb-3" role="alert">Registration successful! Please log in.</div>
      <div th:if="${param.error}" class="alert alert-danger p-2 small mb-3" role="alert">Invalid email address or password.</div>
      <div th:if="${param.logout}" class="alert alert-info p-2 small mb-3" role="alert">You have been logged out.</div>

      <form th:action="@{/login}" action="/login" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold small">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label fw-semibold small mb-0">Password</label>
            <a href="#" class="small text-primary text-decoration-none" onclick="alert('Demo account: demo@example.com / password123'); return false;">Forgot password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small text-secondary" for="rememberMe">
            Remember me on this device
          </label>
        </div>

        <button type="submit" class="btn btn-primary-saas w-100 py-2 mb-3">
          Sign In <i class="bi bi-arrow-right ms-1"></i>
        </button>

        <div class="text-center">
          <span class="small text-secondary">Don't have an account? </span>
          <a th:href="@{/register}" href="register.html" class="small fw-bold text-primary text-decoration-none">Register here</a>
        </div>
      </form>
    </div>

    <div class="text-center mt-4">
      <a th:href="@{/}" href="index.html" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script th:src="@{/js/app.js}" src="../js/app.js"></script>
</body>
</html>
