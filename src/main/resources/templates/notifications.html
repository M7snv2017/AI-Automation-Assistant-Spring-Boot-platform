<!DOCTYPE html>
<html lang="en" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - AI Automation Assistant</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Style -->
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../css/style.css">
</head>
<body>

  <div id="app-wrapper">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay"></div>

    <!-- App Sidebar -->
    <aside th:replace="~{fragments/layout :: sidebar('notifications')}"></aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Navbar -->
      <header th:replace="~{fragments/layout :: navbar('Notification Center')}"></header>

      <!-- Page Content -->
      <div class="page-content">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h4 class="fw-bold mb-1">Notification Center</h4>
            <p class="text-secondary small mb-0">System alerts and human-in-the-loop approval updates</p>
          </div>
          <button class="btn btn-secondary-saas btn-sm" onclick="markAllNotificationsRead();">
            <i class="bi bi-check-all me-1"></i> Mark all as read
          </button>
        </div>

        <div class="card-saas">
          <div class="card-saas-body">
            <!-- Empty State if no notifications -->
            <div th:if="${notifications == null || notifications.isEmpty()}" class="empty-state py-5">
              <div class="empty-state-icon">
                <i class="bi bi-bell-slash"></i>
              </div>
              <h5 class="empty-state-title">No notifications</h5>
              <p class="empty-state-text">You are all caught up! New confirmation requests and system events will show up here.</p>
            </div>

            <!-- Notifications List -->
            <div th:unless="${notifications == null || notifications.isEmpty()}" class="d-flex flex-column gap-2">
              <div th:each="n : ${notifications}" 
                   th:class="${!n.read ? 'p-3 border border-2 border-primary rounded-3 bg-primary-subtle shadow-sm mb-2 position-relative' : 'p-3 border rounded-3 bg-body-tertiary opacity-75 mb-2'}">
                <div class="d-flex align-items-center justify-content-between mb-1.5">
                  <div class="d-flex align-items-center gap-2 flex-wrap">
                    <!-- Unique NEW Badge for unread notifications -->
                    <span th:if="${!n.read}" class="badge bg-primary text-white rounded-pill px-2.5 py-1 me-1 shadow-sm" style="font-size: 0.75rem;">
                      <i class="bi bi-star-fill me-1" style="font-size: 0.65rem;"></i>NEW
                    </span>

                    <!-- Type Tag -->
                    <span th:class="${n.type == 'SUCCESS' ? 'badge bg-success text-white' : (n.type == 'DANGER' ? 'badge bg-danger text-white' : (n.type == 'WARNING' ? 'badge bg-warning text-dark' : 'badge bg-info text-white'))}" th:text="${n.type}">INFO</span>
                    
                    <h6 th:class="${!n.read ? 'fw-bold mb-0 text-primary fs-6' : 'fw-semibold mb-0 text-body fs-6'}" th:text="${n.title}">Notification Title</h6>
                  </div>
                  <span class="small text-muted ms-auto" style="font-size: 0.8rem;" th:text="${#temporals.format(n.createdAt, 'MMM dd, HH:mm')}">Date</span>
                </div>
                <p th:class="${!n.read ? 'small text-body fw-medium mb-0 ps-1' : 'small text-secondary mb-0 ps-1'}" th:text="${n.message}">Notification content</p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script th:src="@{/js/app.js}" src="../js/app.js"></script>

  <!-- Auto Mark All As Read when leaving page -->
  <script>
    let hasMarkedRead = false;

    function autoMarkNotificationsReadOnLeave() {
      if (hasMarkedRead) return;
      hasMarkedRead = true;
      try {
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/notifications/read-all');
        } else {
          fetch('/api/notifications/read-all', { method: 'POST', keepalive: true });
        }
      } catch (e) {}
    }

    window.addEventListener('beforeunload', autoMarkNotificationsReadOnLeave);
    window.addEventListener('pagehide', autoMarkNotificationsReadOnLeave);

    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('a[href]').forEach(function(link) {
        link.addEventListener('click', function() {
          var href = link.getAttribute('href');
          if (href && !href.includes('/notifications') && !href.startsWith('#') && !href.startsWith('javascript')) {
            autoMarkNotificationsReadOnLeave();
          }
        });
      });
    });
  </script>
</body>
</html>
