<!DOCTYPE html>
<html lang="en" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - AI Automation Assistant</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Style -->
  <link rel="stylesheet" th:href="@{/css/style.css}" href="../css/style.css">
</head>
<body>

  <div id="app-wrapper">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay"></div>

    <!-- App Sidebar -->
    <aside th:replace="~{fragments/layout :: sidebar('tasks')}"></aside>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Navbar -->
      <header th:replace="~{fragments/layout :: navbar('Task Manager')}"></header>

      <!-- Page Content -->
      <div class="page-content">
        <!-- Action Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h4 class="fw-bold mb-1">Automation Tasks</h4>
            <p class="text-secondary small mb-0">Manage and execute scheduled browser & AI workflows</p>
          </div>
          <button class="btn btn-primary-saas" data-bs-toggle="modal" data-bs-target="#createTaskModal">
            <i class="bi bi-plus-lg me-1"></i> Create Task
          </button>
        </div>

        <!-- Task List Container -->
        <div id="tasks-container">
          <div th:if="${tasks == null || tasks.isEmpty()}" class="card-saas">
            <div class="empty-state">
              <div class="empty-state-icon">
                <i class="bi bi-check2-square"></i>
              </div>
              <h5 class="empty-state-title">No tasks created</h5>
              <p class="empty-state-text">You have no pending tasks. Click the button above to create your first automation task.</p>
              <button class="btn btn-primary-saas" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                <i class="bi bi-plus-lg me-1"></i> Create Task
              </button>
            </div>
          </div>

          <div th:unless="${tasks == null || tasks.isEmpty()}" class="d-flex flex-column gap-3">
            <div th:each="task : ${tasks}" th:class="${task.completed ? 'card-saas p-3 d-flex flex-row align-items-center justify-content-between opacity-75' : 'card-saas p-3 d-flex flex-row align-items-center justify-content-between'}">
              <div class="d-flex align-items-center gap-3">
                <input class="form-check-input mt-0 fs-5" type="checkbox" th:checked="${task.completed}" th:data-id="${task.id}" onchange="toggleBackendTask(this)">
                <div>
                  <h6 th:class="${task.completed ? 'mb-1 fw-bold text-decoration-line-through text-muted' : 'mb-1 fw-bold text-body'}" th:text="${task.title}">Task Title</h6>
                  <div class="d-flex align-items-center gap-2 flex-wrap">
                    <span class="badge bg-secondary-subtle text-secondary small" th:text="${task.category}">General</span>
                    <span th:if="${task.formattedDueDate != null}" class="badge bg-info-subtle text-info-emphasis small">
                      <i class="bi bi-calendar-event me-1"></i><span th:text="${task.formattedDueDate}">Date</span>
                    </span>
                    <span th:if="${task.description != null && !task.description.isEmpty()}" class="small text-muted" th:text="${task.description}">Description</span>
                  </div>
                </div>
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-icon btn-sm text-danger" th:data-id="${task.id}" onclick="deleteBackendTask(this)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Create Task Modal (Frontend Modal Only) -->
  <div class="modal fade" id="createTaskModal" tabindex="-1" aria-labelledby="createTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="createTaskModalLabel">Create Automation Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="create-task-form">
          <div class="modal-body">
            <div class="mb-3">
              <label for="task-title" class="form-label fw-semibold small">Task Title</label>
              <input type="text" class="form-control" id="task-title" placeholder="e.g. Daily Gmail Digest & Summary" required>
            </div>
            <div class="mb-3">
              <label for="task-category" class="form-label fw-semibold small">Category (1 to 4)</label>
              <select class="form-select" id="task-category">
                <option value="1">1. General Automation</option>
                <option value="2">2. Email Management</option>
                <option value="3">3. Schedule & Reminders</option>
                <option value="4">4. Database Management</option>
              </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="task-recurrence" class="form-label fw-semibold small">Recurrence / Loop</label>
                <select class="form-select" id="task-recurrence">
                  <option value="ONCE">One-time Task</option>
                  <option value="DAILY">Every Day</option>
                  <option value="WEEKLY">Every Week</option>
                  <option value="MONTHLY">Every Month</option>
                  <option value="WEEKDAYS">Every Weekday</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="task-reminder-offset" class="form-label fw-semibold small">Advance Reminder</label>
                <select class="form-select" id="task-reminder-offset">
                  <option value="NONE">At time of event</option>
                  <option value="MINUTES_30">30 minutes before</option>
                  <option value="HOURS_1">1 hour before</option>
                  <option value="DAYS_1">1 day before</option>
                  <option value="WEEKS_1">1 week before</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="task-due-date" class="form-label fw-semibold small">Due Date & Time</label>
              <input type="datetime-local" class="form-control" id="task-due-date">
            </div>
            <div class="mb-3">
              <label for="task-desc" class="form-label fw-semibold small">Instructions / Description</label>
              <textarea class="form-control" id="task-desc" rows="3" placeholder="Specify instructions for the AI assistant..."></textarea>
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-secondary-saas" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-saas">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script th:src="@{/js/app.js}" src="../js/app.js"></script>
</body>
</html>
